<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Vibe Calculator</title>
<!-- Prevent flash of wrong theme -->
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ec;
    --surface: #fff;
    --surface-raised: #faf8f5;
    --border: #d9d4cb;
    --border-active: #b8b0a3;
    --text-primary: #2c2a26;
    --text-secondary: #7a756b;
    --text-muted: #a09889;
    --accent: #c0512d;
    --accent-light: rgba(192, 81, 45, 0.08);
    --accent-glow: rgba(192, 81, 45, 0.12);
    --success: #4a8c3f;
    --success-glow: rgba(74, 140, 63, 0.10);
    --result-bg: rgba(139, 106, 191, 0.08);
    --result-border: rgba(139, 106, 191, 0.25);
    --result-color: #8b6abf;
    --serif: 'Source Serif 4', Georgia, serif;
    --mono: 'DM Mono', 'Courier New', monospace;
    --radius: 8px;
    --radius-lg: 12px;
  }

  [data-theme="dark"] {
    --bg: #1c1917;
    --surface: #292524;
    --surface-raised: #302c28;
    --border: #3d3833;
    --border-active: #564f47;
    --text-primary: #e7e0d8;
    --text-secondary: #9c928a;
    --text-muted: #706860;
    --accent: #d4774a;
    --accent-light: rgba(212, 119, 74, 0.10);
    --accent-glow: rgba(212, 119, 74, 0.15);
    --success: #5ea852;
    --success-glow: rgba(94, 168, 82, 0.12);
    --result-bg: rgba(166, 136, 212, 0.12);
    --result-border: rgba(166, 136, 212, 0.30);
    --result-color: #a688d4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--serif);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* ── Header (matches Tool Directory) ── */
  .site-header {
    padding: 28px 40px;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.3s ease;
  }

  .site-header h1 {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .site-header h1 span {
    color: var(--accent);
  }

  /* ── Theme Toggle (matches Tool Directory) ── */
  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    cursor: pointer;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    width: 38px;
    height: 38px;
  }

  .theme-toggle:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  .theme-toggle svg {
    width: 18px;
    height: 18px;
    stroke-width: 1.5;
    transition: transform 0.3s ease;
  }

  .theme-toggle:hover svg {
    transform: rotate(15deg);
  }

  .theme-toggle .icon-sun,
  .theme-toggle .icon-moon { display: none; }

  .theme-toggle .icon-moon { display: block; }
  .theme-toggle .icon-sun { display: none; }

  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  .container {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    flex: 1;
    width: 100%;
  }

  .input-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 12px;
    animation: fadeInUp 0.5s ease 0.1s both;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .input-area label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  .input-row input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--text-primary);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-row input[type="text"]::placeholder {
    color: var(--text-muted);
  }

  .input-row input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .btn {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    padding: 12px 20px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-vibe {
    background: var(--accent);
    color: #fff;
  }

  .btn-vibe:hover {
    background: #d4623e;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .btn-vibe:active { transform: translateY(0); }

  .btn-clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }

  .btn-clear:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
    animation: fadeInUp 0.5s ease 0.15s both;
  }

  /* Result area */
  .result-area {
    display: none;
    animation: fadeInUp 0.4s ease;
  }

  .result-area.visible { display: block; }

  .list-header {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-left: 4px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow: hidden;
    margin-bottom: 10px;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .result-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--result-color);
  }

  .result-main {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .result-digit {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--result-bg);
    border: 2px solid var(--result-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 600;
    color: var(--result-color);
    flex-shrink: 0;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
  }

  .result-info { flex: 1; }

  .result-input-echo {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    word-break: break-all;
  }

  .result-label {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 2px;
  }

  .result-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }

  /* Breakdown section */
  .breakdown {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .breakdown-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .breakdown-steps {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .step-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-secondary);
    animation: fadeInUp 0.3s ease both;
  }

  .step-row .step-num {
    min-width: 20px;
    color: var(--text-muted);
    font-size: 10px;
  }

  .step-row .step-expr {
    color: var(--text-primary);
    word-break: break-all;
  }

  .step-row .step-eq {
    color: var(--text-muted);
  }

  .step-row .step-result {
    color: var(--result-color);
    font-weight: 500;
  }

  /* History */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 20px;
  }

  .history-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: slideIn 0.3s ease;
    position: relative;
    overflow: hidden;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .history-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--success);
  }

  .history-index {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    min-width: 28px;
    text-align: center;
  }

  .history-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--result-bg);
    color: var(--result-color);
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 600;
  }

  .history-details {
    flex: 1;
    min-width: 0;
  }

  .history-input {
    font-size: 14px;
    font-weight: 600;
    font-family: var(--serif);
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .history-vibe {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--success);
    white-space: nowrap;
  }

  .history-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    font-size: 18px;
    line-height: 1;
    transition: all 0.2s;
    opacity: 0.5;
  }

  .history-remove:hover { color: #b5392e; opacity: 1; background: rgba(181, 57, 46, 0.10); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    animation: fadeInUp 0.4s ease;
  }

  .empty-state svg { margin-bottom: 16px; opacity: 0.3; }

  .empty-state p {
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── Footer (matches Tool Directory) ── */
  footer {
    padding: 28px 40px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    transition: border-color 0.3s ease, color 0.3s ease;
  }

  footer a {
    text-decoration: none;
    color: inherit;
    transition: color 0.2s ease;
  }

  footer a:hover {
    color: var(--accent);
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-16px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.6); }
    to { opacity: 1; transform: scale(1); }
  }

  @media (max-width: 600px) {
    .site-header { padding: 20px 16px; }
    .container { padding: 32px 16px 60px; }
    .input-row { flex-direction: column; }
    footer { padding: 24px 16px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <h1><span>VIBE</span> CALCULATOR</h1>
  <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </svg>
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/><path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/><path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
    </svg>
  </button>
</header>

<div class="container">

  <div class="input-area">
    <label for="vibeInput">Enter a name, number or phrase</label>
    <div class="input-row">
      <input type="text" id="vibeInput" placeholder="e.g. Matilda, Sydney, 42, Great Barrier Reef…" autocomplete="off" spellcheck="false">
      <button class="btn btn-vibe" id="vibeBtn" onclick="vibeCheck()">Vibe Check</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-clear" id="clearBtn" onclick="clearHistory()">Clear History</button>
  </div>

  <!-- Latest result -->
  <div class="result-area" id="resultArea">
    <div class="list-header">Result</div>
    <div class="result-card">
      <div class="result-main">
        <div class="result-digit" id="resultDigit">—</div>
        <div class="result-info">
          <div class="result-input-echo" id="resultEcho"></div>
          <div class="result-label" id="resultLabel"></div>
          <div class="result-sub" id="resultSub"></div>
        </div>
      </div>
      <div class="breakdown" id="breakdown">
        <div class="breakdown-title">Reduction Steps</div>
        <div class="breakdown-steps" id="breakdownSteps"></div>
      </div>
    </div>
  </div>

  <!-- History -->
  <div id="historySection" style="display:none; margin-top: 24px;">
    <div class="list-header">History</div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="2"/>
      <path d="M17 28c1.5 3 4 4.5 7 4.5s5.5-1.5 7-4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="18" cy="20" r="2" fill="currentColor"/>
      <circle cx="30" cy="20" r="2" fill="currentColor"/>
    </svg>
    <p>Type something above and hit Vibe Check<br>to discover its vibe.</p>
  </div>

</div>

<footer><a href="index.html"><span style="color: var(--accent);">dev.</span>nialfernandes.com</a></footer>

<script>
  // ── Theme toggle ────────────────────────────────────────────────────
  (function() {
    var toggle = document.querySelector('.theme-toggle');
    toggle.addEventListener('click', function() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  })();

  const LETTER_MAP = {
    A:1, B:2, C:3, D:4, E:5, F:8, G:3, H:5, I:1, J:1, K:2, L:3,
    M:4, N:5, O:7, P:8, Q:1, R:2, S:3, T:4, U:6, V:6, W:6, X:5,
    Y:1, Z:7
  };

  const history = [];

  const vibeInput = document.getElementById('vibeInput');
  const resultArea = document.getElementById('resultArea');
  const emptyState = document.getElementById('emptyState');

  vibeInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') vibeCheck();
  });

  function convertToDigits(input) {
    const upper = input.toUpperCase();
    let digits = [];
    for (const ch of upper) {
      if (LETTER_MAP[ch] !== undefined) {
        digits.push(LETTER_MAP[ch]);
      } else if (/[0-9]/.test(ch)) {
        digits.push(parseInt(ch, 10));
      }
    }
    return digits;
  }

  function sumDigits(digits) {
    return digits.reduce((a, b) => a + b, 0);
  }

  function digitalRoot(digits) {
    const steps = [];
    let current = [...digits];

    if (current.length === 0) return { result: 0, steps: [] };
    if (current.length === 1) return { result: current[0], steps: [] };

    while (current.length > 1 || current[0] > 9) {
      const expr = current.join(' + ');
      const total = sumDigits(current);
      steps.push({ expr, total });
      current = String(total).split('').map(Number);
    }

    return { result: current[0], steps };
  }

  function vibeCheck() {
    const raw = vibeInput.value.trim();
    if (!raw) return;

    const digits = convertToDigits(raw);
    if (digits.length === 0) {
      alert('No letters or numbers found in your input. Give it another go!');
      return;
    }

    const { result, steps } = digitalRoot(digits);

    emptyState.style.display = 'none';
    resultArea.classList.add('visible');

    document.getElementById('resultDigit').textContent = result;
    document.getElementById('resultEcho').textContent = `"${raw}"`;
    document.getElementById('resultLabel').textContent = `Vibe: ${result}`;
    document.getElementById('resultSub').textContent = `from ${digits.length} mapped digit${digits.length !== 1 ? 's' : ''}: ${digits.join(', ')}`;

    const stepsEl = document.getElementById('breakdownSteps');
    stepsEl.innerHTML = '';

    if (steps.length === 0) {
      stepsEl.innerHTML = '<div class="step-row"><span class="step-num"></span><span class="step-expr">Single digit — no reduction needed.</span></div>';
    } else {
      steps.forEach((s, i) => {
        const row = document.createElement('div');
        row.className = 'step-row';
        row.style.animationDelay = `${i * 0.08}s`;
        row.innerHTML = `
          <span class="step-num">${i + 1}.</span>
          <span class="step-expr">${s.expr}</span>
          <span class="step-eq">=</span>
          <span class="step-result">${s.total}</span>
        `;
        stepsEl.appendChild(row);
      });
    }

    history.unshift({ input: raw, result, digitCount: digits.length });
    vibeInput.value = '';
    vibeInput.focus();
    renderHistory();
  }

  function renderHistory() {
    const section = document.getElementById('historySection');
    const list = document.getElementById('historyList');

    const past = history.slice(1);
    if (past.length === 0) {
      section.style.display = 'none';
      return;
    }

    section.style.display = 'block';
    list.innerHTML = '';

    past.forEach((item, i) => {
      const el = document.createElement('div');
      el.className = 'history-item';
      el.innerHTML = `
        <span class="history-index">${String(i + 1).padStart(2, '0')}</span>
        <div class="history-icon">${item.result}</div>
        <div class="history-details">
          <div class="history-input" title="${escapeHtml(item.input)}">${escapeHtml(item.input)}</div>
          <div class="history-sub">${item.digitCount} mapped digits</div>
        </div>
        <span class="history-vibe">Vibe ${item.result}</span>
        <button class="history-remove" onclick="removeHistory(${i})" title="Remove">&times;</button>
      `;
      list.appendChild(el);
    });
  }

  function removeHistory(idx) {
    history.splice(idx + 1, 1);
    renderHistory();
  }

  function clearHistory() {
    history.length = 0;
    resultArea.classList.remove('visible');
    emptyState.style.display = 'block';
    document.getElementById('historySection').style.display = 'none';
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
</script>

</body>
</html>
