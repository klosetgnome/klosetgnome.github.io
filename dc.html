<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<script src="/analytics.js"></script>
<title>Daily Calendar</title>
<!-- Prevent flash of wrong theme -->
<script>
    (function() {
        var saved = localStorage.getItem('theme');
        if (saved) {
            document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
</script>
<link rel="stylesheet" href="astyle.css">
<style>
  /* ── Page-specific tokens ── */
  :root {
    /* Good = neutral / plain surface */
    --good-color: var(--text-primary);
    --good-bg: var(--surface);
    --good-border: var(--border);
    /* Bad = accent red */
    --bad-color: #c0512d;
    --bad-bg: #f0ddd6;
    --bad-border: rgba(192, 81, 45, 0.25);
    --bad-bg-subtle: rgba(192, 81, 45, 0.08);
  }

  [data-theme="dark"] {
    --surface-raised: #332e2b;
    --border-active: #524c45;
    /* Good = neutral / plain surface */
    --good-color: var(--text-primary);
    --good-bg: var(--surface);
    --good-border: var(--border);
    /* Bad = accent red (dark) */
    --bad-color: #d4774a;
    --bad-bg: #362a22;
    --bad-border: rgba(212, 119, 74, 0.25);
    --bad-bg-subtle: rgba(212, 119, 74, 0.10);
  }

  /* ── Main ── */
  .container {
    position: relative;
    z-index: 1;
    margin: 0 auto;
    padding: 48px 40px 80px;
    flex: 1;
  }

  .topbar {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    animation: fadeInUp 0.5s ease 0.1s both;
  }

  .topbar button {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 18px;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface);
    color: var(--text-primary);
    white-space: nowrap;
  }

  .topbar button:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .topbar button:active { transform: translateY(0); }

  .month-label {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    min-width: 140px;
    text-align: center;
    padding: 8px 16px;
    border-radius: var(--radius);
    transition: background 0.2s ease, color 0.2s ease;
  }

  .month-label.good { background: transparent; color: var(--text-primary); }
  .month-label.bad { background: var(--bad-bg-subtle); color: var(--bad-color); }

  .main-row {
    display: flex;
    align-items: stretch;
    gap: 16px;
    margin-bottom: 24px;
    animation: fadeInUp 0.5s ease 0.15s both;
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: clamp(6px, 1vw, 12px);
    padding: clamp(20px, 3vw, 40px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    align-content: start;
    flex: 1;
    min-width: 0;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .day-name {
    font-family: var(--mono);
    font-size: clamp(10px, 1.2vw, 13px);
    font-weight: 400;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    padding-bottom: 8px;
    text-align: center;
  }

  .date {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-weight: 600;
    font-size: clamp(15px, 2.2vw, 26px);
    cursor: pointer;
    position: relative;
    transition: all 0.2s ease;
    border: 1px solid transparent;
    font-family: var(--serif);
  }

  .good { background: var(--good-bg); color: var(--good-color); }
  .good:hover { border-color: var(--good-border); }
  .bad { background: var(--bad-bg); color: var(--bad-color); }
  .bad:hover { border-color: var(--bad-border); }
  .empty { visibility: hidden; }

  .selected::after {
    content: "";
    position: absolute;
    inset: -3px;
    border: 2px solid var(--accent);
    border-radius: 10px;
    pointer-events: none;
  }

  .info-row {
    display: flex;
    justify-content: center;
    animation: fadeInUp 0.5s ease 0.2s both;
  }

  .info {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 20px;
    border-radius: 20px;
    font-weight: 500;
    font-family: var(--mono);
    letter-spacing: 1.5px;
    font-size: 12px;
    text-transform: uppercase;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    transition: all 0.2s ease;
  }

  .info.good { background: transparent; color: var(--text-secondary); border-color: var(--border); }
  .info.bad { background: var(--bad-bg-subtle); color: var(--bad-color); border-color: var(--bad-border); }

  .task-panel {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 0;
    text-align: left;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .task-panel-header {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .task-list { display: flex; flex-direction: column; gap: 6px; flex: 1; }

  .task-item {
    padding: 10px 12px;
    border-radius: 6px;
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    border: 1px solid transparent;
    transition: all 0.2s ease;
  }

  .task-item.good { background: var(--surface-raised); color: var(--text-primary); }
  .task-item.good:hover { border-color: var(--border); }
  .task-item.bad { background: var(--bad-bg); color: var(--bad-color); }
  .task-item.bad:hover { border-color: var(--bad-border); }
  .task-item.neutral { background: var(--surface-raised); color: var(--text-muted); }

  .task-empty { font-family: var(--mono); font-size: 12px; color: var(--text-muted); letter-spacing: 1px; padding: 8px 0; }

  .task-error {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--bad-color);
    letter-spacing: 0.5px;
    padding: 8px 0;
    line-height: 1.5;
  }

  @media (max-width: 600px) {
    .container { padding: 32px 16px 60px; }
    .main-row { flex-direction: column; }
    .task-panel { width: 100%; }
    .calendar { padding: 16px; gap: 6px; }
    .date { font-size: 14px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <h1><span>DAILY</span> CALENDAR</h1>
  <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
    <!-- Moon: shown in light mode -->
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </svg>
    <!-- Sun: shown in dark mode -->
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/><path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/><path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
    </svg>
  </button>
</header>

<div class="container">

  <div class="topbar">
    <button id="prev">&#8592; Prev</button>
    <div id="label" class="month-label"></div>
    <button id="next">Next &#8594;</button>
  </div>

  <div class="main-row">
    <div id="calendar" class="calendar"></div>

    <div class="task-panel">
      <div class="task-panel-header" id="task-header">Tasks</div>
      <div class="task-list" id="task-list">
        <span class="task-empty">Loading…</span>
      </div>
    </div>
  </div>

  <div class="info-row">
    <div id="info" class="info">—</div>
  </div>
</div>

<footer>
      <a href="index.html"><span style="color: var(--accent);">dev.</span>nialfernandes.com</a>
      <span style="color: var(--text-muted); margin: 0 8px;">|</span>
      <a href="privacy.html">Privacy Policy</a>
</footer>

<script>
const badVals=[2,4,8];
const DAY_KEYS=["Su","M","T","W","Th","F","Sa"];
const DAY_LABELS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

let current=new Date();
current.setDate(1);
const today=new Date();
let selectedEl=null;
let selectedDate=new Date(today);
let tasks={};
let tasksLoaded=false;
let tasksError=null;

fetch("zpmtdc.txt")
  .then(r=>{if(!r.ok)throw new Error(`Could not load dc.txt (${r.status})`);return r.text();})
  .then(text=>{tasks=parseTasks(text);tasksLoaded=true;updateTaskPanel();})
  .catch(err=>{tasksError=err.message;tasksLoaded=true;updateTaskPanel();});

function parseTasks(text){
  const result={};
  const lines=text.split(/\r?\n/);
  for(const line of lines){
    const trimmed=line.trim();
    if(!trimmed)continue;
    const colonIdx=trimmed.indexOf(":");
    if(colonIdx===-1)continue;
    const key=trimmed.slice(0,colonIdx).trim();
    const rest=trimmed.slice(colonIdx+1).trim();
    const items=rest.split("|").map(s=>s.trim()).filter(Boolean);
    if(items.length)result[key]=items;
  }
  return result;
}

function digitSum(n){return n.toString().split('').reduce((a,b)=>a+ +b,0);}
function digitalRoot(n){while(n>9)n=digitSum(n);return n;}
function goodOrBad(n){return badVals.includes(digitalRoot(n))?"bad":"good";}
function yearMonthValue(y,m){return digitalRoot(digitSum(y)+digitSum(m));}
function dayValue(d){return digitalRoot(digitSum(d));}

function getDayState(y,m,d){
  const ym=yearMonthValue(y,m);
  const dv=dayValue(d);
  const combinedRoot=digitalRoot(ym+dv);
  return badVals.includes(combinedRoot)?"bad":"good";
}

function updateInfo(y,m,d){
  const ym=yearMonthValue(y,m);
  const dv=dayValue(d);
  const info=document.getElementById("info");
  info.textContent=`${ym}, ${dv}`;
  const combinedRoot=digitalRoot(ym+dv);
  info.className="info "+(badVals.includes(combinedRoot)?"bad":"good");
}

function updateTaskPanel(){
  if(!tasksLoaded)return;
  const y=selectedDate.getFullYear();
  const m=selectedDate.getMonth()+1;
  const d=selectedDate.getDate();
  const dow=selectedDate.getDay();
  const key=DAY_KEYS[dow];
  const label=DAY_LABELS[dow];
  const state=getDayState(y,m,d);
  const header=document.getElementById("task-header");
  header.textContent=label;
  const list=document.getElementById("task-list");
  list.innerHTML="";
  if(tasksError){
    const el=document.createElement("span");
    el.className="task-error";
    el.textContent=`dc.txt not found.\nServe this file from a local server.`;
    el.style.whiteSpace="pre-line";
    list.appendChild(el);
    return;
  }
  const dayTasks=tasks[key]||[];
  if(dayTasks.length===0){
    const el=document.createElement("span");
    el.className="task-empty";
    el.textContent="No tasks";
    list.appendChild(el);
    return;
  }
  dayTasks.forEach(t=>{
    const el=document.createElement("div");
    el.className=`task-item ${state}`;
    el.textContent=t;
    list.appendChild(el);
  });
}

function select(el,y,m,d){
  if(selectedEl)selectedEl.classList.remove("selected");
  selectedEl=el;
  el.classList.add("selected");
  selectedDate=new Date(y,m-1,d);
  updateInfo(y,m,d);
  updateTaskPanel();
}

function render(){
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  selectedEl=null;
  const y=current.getFullYear();
  const m=current.getMonth()+1;
  const label=document.getElementById("label");
  label.textContent=`${y}-${String(m).padStart(2,'0')}`;
  label.className="month-label "+goodOrBad(digitSum(y)+digitSum(m));
  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  names.forEach(d=>{
    const e=document.createElement("div");
    e.textContent=d;
    e.className="day-name";
    cal.appendChild(e);
  });
  const firstDay=new Date(y,m-1,1).getDay();
  const daysInMonth=new Date(y,m,0).getDate();
  for(let i=0;i<firstDay;i++){
    const e=document.createElement("div");
    e.className="date empty";
    cal.appendChild(e);
  }
  for(let d=1;d<=daysInMonth;d++){
    const el=document.createElement("div");
    el.className="date "+goodOrBad(digitSum(d));
    el.textContent=d;
    el.onclick=()=>{
      const combined=digitSum(y)+digitSum(m)+digitSum(d);
      el.classList.remove("good","bad");
      el.classList.add(goodOrBad(combined));
      select(el,y,m,d);
    };
    cal.appendChild(el);
    if(d===selectedDate.getDate()&&m-1===selectedDate.getMonth()&&y===selectedDate.getFullYear()){
      select(el,y,m,d);
    }
  }
}

function moveSelection(days){
  selectedDate.setDate(selectedDate.getDate()+days);
  current=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
  render();
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")moveSelection(-1);
  if(e.key==="ArrowRight")moveSelection(1);
  if(e.key==="ArrowUp")moveSelection(-7);
  if(e.key==="ArrowDown")moveSelection(7);
});

document.getElementById("prev").onclick=()=>{current.setMonth(current.getMonth()-1);render();};
document.getElementById("next").onclick=()=>{current.setMonth(current.getMonth()+1);render();};

// Theme toggle
const toggle = document.querySelector('.theme-toggle');
toggle.addEventListener('click', function() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
});

render();
</script>

</body>
</html>
