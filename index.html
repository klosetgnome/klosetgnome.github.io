<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <script src="/analytics.js"></script>
    <title>Tool Directory</title>
    <!-- Prevent flash of wrong theme -->
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="astyle.css">
    <style>
        /* ── Main ── */
        main {
            max-width: 720px;
            margin: 80px auto;
            padding: 0 20px;
            text-align: center;
            flex: 1;
        }

        /* ── Icon Garden ── */
        .icon-garden {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 560px;
            margin: 0 auto;
        }

        .tool-pod {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 32px 16px 28px;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            position: relative;
            transition: all 0.25s ease;
            background: transparent;
            width: calc((100% - 24px) / 3);
        }

        .tool-pod:hover {
            background: var(--surface);
            box-shadow: 0 2px 20px var(--shadow);
        }

        .tool-pod:hover .pod-icon {
            color: var(--accent);
            transform: translateY(-2px);
        }

        .tool-pod:hover .pod-name {
            color: var(--accent);
        }

        .pod-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            transition: all 0.25s ease;
            box-shadow: 0 1px 3px var(--shadow-sm);
        }

        .pod-icon svg {
            width: 22px;
            height: 22px;
            stroke-width: 1.5;
        }

        .pod-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .pod-name {
            font-family: var(--serif);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            transition: color 0.2s ease;
        }

        .pod-desc {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.3px;
            color: var(--text-secondary);
            line-height: 1.4;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.25s ease;
        }

        .tool-pod:hover .pod-desc {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── Responsive: tablet ── */
        @media (max-width: 640px) {
            .site-header {
                padding: 24px 20px;
            }

            main {
                margin: 56px auto;
            }

            .tool-pod {
                width: calc((100% - 12px) / 2);
                padding: 28px 14px 24px;
            }

            footer {
                padding: 24px 20px;
            }
        }

        /* ── Responsive: mobile ── */
        @media (max-width: 380px) {
            main {
                margin: 40px auto;
                padding: 0 12px;
            }

            .tool-pod {
                width: calc((100% - 12px) / 2);
                padding: 24px 10px 20px;
            }

            .pod-desc {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Staggered entrance ── */
        @keyframes podIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .tool-pod {
            animation: podIn 0.4s ease both;
        }

        .tool-pod:nth-child(1) { animation-delay: 0.05s; }
        .tool-pod:nth-child(2) { animation-delay: 0.1s; }
        .tool-pod:nth-child(3) { animation-delay: 0.15s; }
        .tool-pod:nth-child(4) { animation-delay: 0.2s; }
        .tool-pod:nth-child(5) { animation-delay: 0.25s; }
        .tool-pod:nth-child(6) { animation-delay: 0.3s; }
    </style>
</head>
<body>

        </button>
    </header>

    <script>
        const toggle = document.querySelector('.theme-toggle');

        toggle.addEventListener('click', function() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const next = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    </script>
