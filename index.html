<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Tool Directory</title>
    <!-- Prevent flash of wrong theme -->
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=DM+Mono:wght@400&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f4f1ec;
            --surface: #fff;
            --text: #2c2a26;
            --text-muted: #7a756b;
            --accent: #c0512d;
            --border: #d9d4cb;
            --shadow: rgba(44, 42, 38, 0.06);
            --shadow-sm: rgba(44, 42, 38, 0.05);
            --serif: 'Source Serif 4', Georgia, serif;
            --mono: 'DM Mono', 'Courier New', monospace;
        }

        [data-theme="dark"] {
            --bg: #1c1917;
            --surface: #292524;
            --text: #e7e0d8;
            --text-muted: #9c928a;
            --accent: #d4774a;
            --border: #3d3833;
            --shadow: rgba(0, 0, 0, 0.2);
            --shadow-sm: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: var(--serif);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
            transition: background 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        header {
            padding: 28px 40px;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.3s ease;
        }

        header h1 {
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--accent);
        }

        /* ── Theme Toggle ── */
        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            width: 38px;
            height: 38px;
        }

        .theme-toggle:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
            stroke-width: 1.5;
            transition: transform 0.3s ease;
        }

        .theme-toggle:hover svg {
            transform: rotate(15deg);
        }

        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon { display: none; }

        /* Light mode: show moon (click to go dark) */
        .theme-toggle .icon-moon { display: block; }
        .theme-toggle .icon-sun { display: none; }

        [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
        [data-theme="dark"] .theme-toggle .icon-sun { display: block; }

        /* ── Main ── */
        main {
            max-width: 720px;
            margin: 80px auto;
            padding: 0 20px;
            text-align: center;
            flex: 1;
        }

        /* ── Icon Garden ── */
        .icon-garden {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 560px;
            margin: 0 auto;
        }

        .tool-pod {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 32px 16px 28px;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            position: relative;
            transition: all 0.25s ease;
            background: transparent;
            width: calc((100% - 24px) / 3);
        }

        .tool-pod:hover {
            background: var(--surface);
            box-shadow: 0 2px 20px var(--shadow);
        }

        .tool-pod:hover .pod-icon {
            color: var(--accent);
            transform: translateY(-2px);
        }

        .tool-pod:hover .pod-name {
            color: var(--accent);
        }

        .pod-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            transition: all 0.25s ease;
            box-shadow: 0 1px 3px var(--shadow-sm);
        }

        .pod-icon svg {
            width: 22px;
            height: 22px;
            stroke-width: 1.5;
        }

        .pod-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .pod-name {
            font-family: var(--serif);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            transition: color 0.2s ease;
        }

        .pod-desc {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            line-height: 1.4;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.25s ease;
        }

        .tool-pod:hover .pod-desc {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── Footer ── */
        footer {
            padding: 28px 40px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        footer a {
            text-decoration: none;
            color: inherit;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: var(--accent);
        }

        /* ── Responsive: tablet ── */
        @media (max-width: 640px) {
            header {
                padding: 24px 20px;
            }

            main {
                margin: 56px auto;
            }

            .tool-pod {
                width: calc((100% - 12px) / 2);
                padding: 28px 14px 24px;
            }

            footer {
                padding: 24px 20px;
            }
        }

        /* ── Responsive: mobile ── */
        @media (max-width: 380px) {
            main {
                margin: 40px auto;
                padding: 0 12px;
            }

            .tool-pod {
                width: calc((100% - 12px) / 2);
                padding: 24px 10px 20px;
            }

            .pod-desc {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Staggered entrance ── */
        @keyframes podIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .tool-pod {
            animation: podIn 0.4s ease both;
        }

        .tool-pod:nth-child(1) { animation-delay: 0.05s; }
        .tool-pod:nth-child(2) { animation-delay: 0.1s; }
        .tool-pod:nth-child(3) { animation-delay: 0.15s; }
        .tool-pod:nth-child(4) { animation-delay: 0.2s; }
        .tool-pod:nth-child(5) { animation-delay: 0.25s; }
    </style>
</head>
<body>

    <header>
        <h1><span>TOOL</span> DIRECTORY</h1>
        <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
            <!-- Moon: shown in light mode -->
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
            <!-- Sun: shown in dark mode -->
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2"/><path d="M12 20v2"/>
                <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
                <path d="M2 12h2"/><path d="M20 12h2"/>
                <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
            </svg>
        </button>
    </header>

    <main>
        <div class="icon-garden">

            <a href="dh.html" class="tool-pod">
                <div class="pod-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
                    </svg>
                </div>
                <div class="pod-text">
                    <div class="pod-name">Description Helper</div>
                    <div class="pod-desc">Copy &amp; headlines</div>
                </div>
            </a>

            <a href="vc.html" class="tool-pod">
                <div class="pod-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
                    </svg>
                </div>
                <div class="pod-text">
                    <div class="pod-name">Vibe Calculator</div>
                    <div class="pod-desc">Calculate the vibe</div>
                </div>
            </a>

            <a href="dc.html" class="tool-pod">
                <div class="pod-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M8 2v4"/><path d="M16 2v4"/>
                        <rect width="18" height="18" x="3" y="4" rx="2"/>
                        <path d="M3 10h18"/>
                        <path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/>
                        <path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>
                    </svg>
                </div>
                <div class="pod-text">
                    <div class="pod-name">Daily Calendar</div>
                    <div class="pod-desc">Schedule &amp; tasks</div>
                </div>
            </a>

            <a href="dm.html" class="tool-pod">
                <div class="pod-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 17V3"/><path d="m6 11 6 6 6-6"/>
                        <path d="M19 21H5"/>
                    </svg>
                </div>
                <div class="pod-text">
                    <div class="pod-name">Download Manager</div>
                    <div class="pod-desc">Managed downloads</div>
                </div>
            </a>

            <a href="th.html" class="tool-pod">
                <div class="pod-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16.5 12"/>
                    </svg>
                </div>
                <div class="pod-text">
                    <div class="pod-name">Timecode Helper</div>
                    <div class="pod-desc">Set timecodes</div>
                </div>
            </a>

        </div>
    </main>

    <footer><a href="index.html"><span style="color: var(--accent);">dev.</span>nialfernandes.com</a></footer>

    <script>
        const toggle = document.querySelector('.theme-toggle');

        toggle.addEventListener('click', function() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const next = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    </script>

</body>
</html>
