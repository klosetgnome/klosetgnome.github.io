<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <script src="/analytics.js"></script>
    <title>DEV.NIALFERNANDES.COM</title>
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="astyle.css">
    <style>
        main {
            max-width: 960px;
            margin: 80px auto;
            padding: 0 20px;
            text-align: center;
            flex: 1;
        }

        .blurb-rule {
            width: 80px;
            border: none;
            border-top: 1px solid var(--border);
            margin: 28px auto 32px;
        }

        /* ── Icon Garden ── */
        .icon-garden {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 820px;
            margin: 0 auto;
        }

        .tool-pod {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 32px 16px 28px;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            position: relative;
            transition: all 0.25s ease;
            background: transparent;
            width: calc((100% - 48px) / 5);
        }

        .tool-pod:hover {
            background: var(--surface);
            box-shadow: 0 2px 20px var(--shadow);
        }

        .tool-pod:hover .pod-icon {
            color: var(--accent);
            transform: translateY(-2px);
        }

        .tool-pod:hover .pod-name {
            color: var(--accent);
        }

        .pod-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            transition: all 0.25s ease;
            box-shadow: 0 1px 3px var(--shadow-sm);
        }

        .pod-icon svg {
            width: 22px;
            height: 22px;
            stroke-width: 1.5;
        }

        .pod-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .pod-name {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            line-height: 1.3;
            transition: color 0.2s ease;
        }

        .pod-desc {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            line-height: 1.4;
            opacity: 0.55;
            transition: all 0.25s ease;
        }

        .tool-pod:hover .pod-desc {
            opacity: 1;
        }

        .sign-out {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s ease;
            margin-top: 24px;
            display: inline-block;
        }

        .sign-out:hover {
            opacity: 1;
            color: var(--accent);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            main { margin: 56px auto; }
            .tool-pod {
                width: calc((100% - 24px) / 3);
                padding: 28px 14px 24px;
            }
        }

        @media (max-width: 480px) {
            main {
                margin: 40px auto;
                padding: 0 12px;
            }
            .tool-pod {
                width: calc((100% - 12px) / 2);
                padding: 24px 10px 20px;
            }
            .pod-desc { opacity: 1; }
        }

        /* ── Staggered entrance ── */
        @keyframes podIn {
            from { opacity: 0; transform: translateY(12px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .tool-pod { animation: podIn 0.4s ease both; }
        .tool-pod:nth-child(1) { animation-delay: 0.05s; }
        .tool-pod:nth-child(2) { animation-delay: 0.1s; }
        .tool-pod:nth-child(3) { animation-delay: 0.15s; }
        .tool-pod:nth-child(4) { animation-delay: 0.2s; }
        .tool-pod:nth-child(5) { animation-delay: 0.25s; }
        .tool-pod:nth-child(6) { animation-delay: 0.3s; }
        .tool-pod:nth-child(7) { animation-delay: 0.35s; }
        .tool-pod:nth-child(8) { animation-delay: 0.4s; }
        .tool-pod:nth-child(9) { animation-delay: 0.45s; }
        .tool-pod:nth-child(10) { animation-delay: 0.5s; }
    </style>
</head>
<body>

    <header class="site-header">
        <h1><span>DEV.</span>NIALFERNANDES.COM</h1>
        <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2"/><path d="M12 20v2"/>
                <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
                <path d="M2 12h2"/><path d="M20 12h2"/>
                <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
            </svg>
        </button>
    </header>

    <main>
        <p class="site-blurb">This is a personal collection of web tools, built and maintained as a side project. Feel free to use anything here, but please don't depend on it. These tools are in constant evolution and may change or vanish at any time.</p>

        <hr class="blurb-rule">

        <!--
            Tool pods are injected here by the Worker from the TOOLS config.
            To add, remove, or rename tools, edit the TOOLS array in worker.js.
        -->
        <div class="icon-garden">
            <!-- TOOL_PODS -->
        </div>

        <a class="sign-out" href="/auth/signout">sign out</a>
    </main>

    <footer>
      <a href="index.html"><span style="color: var(--accent);">dev.</span>nialfernandes.com</a>
      <span style="color: var(--text-muted); margin: 0 8px;">|</span>
      <a href="privacy.html">Privacy Policy</a>
    </footer>

    <script>
        document.querySelector('.theme-toggle').addEventListener('click', function() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            var next = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    </script>

</body>
</html>
