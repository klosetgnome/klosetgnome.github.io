<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Video Downloader</title>
<!-- Prevent flash of wrong theme -->
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link rel="stylesheet" href="astyle.css">
<style>
  /* ── Page-specific: Video Downloader ── */
  :root {
    --fetching: #8b6abf;
    --fetching-glow: rgba(139, 106, 191, 0.12);
  }

  [data-theme="dark"] {
    --fetching: #a688d4;
    --fetching-glow: rgba(166, 136, 212, 0.15);
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    flex: 1;
    width: 100%;
  }

  /* Input area */
  .input-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 12px;
    animation: fadeInUp 0.5s ease 0.1s both;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .input-area label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  .input-row input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--text-primary);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
  }

  .input-row input[type="text"]::placeholder { color: var(--text-muted); }

  .input-row input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .btn {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    padding: 12px 20px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-fetch {
    background: var(--accent);
    color: #fff;
  }

  .btn-fetch:hover {
    background: #d4623e;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .btn-fetch:active { transform: translateY(0); }

  .btn-fetch:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  /* Error message */
  .error-msg {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--error);
    padding: 10px 0 0;
    display: none;
  }

  .error-msg.visible { display: block; }

  /* Loading state */
  .loading-bar {
    height: 3px;
    background: var(--border);
    border-radius: 3px;
    margin-top: 14px;
    overflow: hidden;
    display: none;
  }

  .loading-bar.visible { display: block; }

  .loading-bar-fill {
    height: 100%;
    background: var(--fetching);
    border-radius: 3px;
    width: 40%;
    animation: indeterminate 1.8s ease-in-out infinite;
  }

  /* Video info card */
  .video-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 12px;
    display: none;
    animation: fadeInUp 0.4s ease;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .video-card.visible { display: block; }

  .video-thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--bg);
    overflow: hidden;
  }

  .video-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .video-duration-badge {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-family: var(--mono);
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }

  .video-info-body {
    padding: 18px 20px;
  }

  .video-title {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.4;
    margin-bottom: 6px;
  }

  .video-meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .video-meta span { white-space: nowrap; }

  /* Format select area */
  .format-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 12px;
    display: none;
    animation: fadeInUp 0.4s ease 0.05s both;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .format-area.visible { display: block; }

  .format-area label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .format-row {
    display: flex;
    gap: 10px;
  }

  .format-select {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 36px 12px 16px;
    color: var(--text-primary);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%237a756b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }

  .format-select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .format-select option {
    background: var(--surface);
    color: var(--text-primary);
  }

  .format-select optgroup {
    font-family: var(--mono);
    font-weight: 500;
    color: var(--text-secondary);
  }

  .btn-download {
    background: var(--success);
    color: #fff;
  }

  .btn-download:hover {
    background: #5a9e4f;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px var(--success-glow);
  }

  .btn-download:active { transform: translateY(0); }

  .btn-download:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  /* Download progress card */
  .dl-progress-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    display: none;
    animation: fadeInUp 0.4s ease;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .dl-progress-card.visible { display: block; }

  .dl-progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .dl-progress-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .dl-progress-pct {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--fetching);
  }

  .dl-progress-pct.done { color: var(--success); }
  .dl-progress-pct.error { color: var(--error); }

  .dl-progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .dl-progress-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--fetching);
    transition: width 0.4s ease, background 0.3s;
    width: 0%;
  }

  .dl-progress-fill.done { background: var(--success); }
  .dl-progress-fill.error { background: var(--error); }

  .dl-progress-fill.indeterminate {
    width: 40%;
    animation: indeterminate 1.8s ease-in-out infinite;
  }

  .dl-progress-stats {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    gap: 16px;
  }

  .dl-progress-actions {
    margin-top: 16px;
    display: flex;
    gap: 10px;
  }

  .btn-save {
    background: var(--success);
    color: #fff;
  }

  .btn-save:hover {
    background: #5a9e4f;
    box-shadow: 0 4px 16px var(--success-glow);
  }

  .btn-new {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }

  .btn-new:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    animation: fadeInUp 0.4s ease 0.15s both;
  }

  .empty-state svg { margin-bottom: 16px; opacity: 0.3; }

  .empty-state p {
    font-size: 15px;
    line-height: 1.6;
  }

  /* Animations */
  @keyframes indeterminate {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .container { padding: 32px 16px 60px; }
    .input-row, .format-row { flex-direction: column; }
    .video-meta { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <h1><span>VIDEO</span> DOWNLOADER</h1>
  <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </svg>
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/><path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/><path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
    </svg>
  </button>
</header>

<div class="container">

  <!-- Step 1: URL Input -->
  <div class="input-area" id="inputArea">
    <label for="urlInput">YouTube video link</label>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" spellcheck="false">
      <button class="btn btn-fetch" id="fetchBtn" onclick="fetchInfo()">Fetch</button>
    </div>
    <div class="loading-bar" id="fetchLoading"><div class="loading-bar-fill"></div></div>
    <div class="error-msg" id="fetchError"></div>
  </div>

  <!-- Step 2: Video Info -->
  <div class="video-card" id="videoCard">
    <div class="video-thumb-wrap">
      <img id="videoThumb" src="" alt="Video thumbnail">
      <span class="video-duration-badge" id="videoDuration"></span>
    </div>
    <div class="video-info-body">
      <div class="video-title" id="videoTitle"></div>
      <div class="video-meta">
        <span id="videoUploader"></span>
        <span id="videoViews"></span>
      </div>
    </div>
  </div>

  <!-- Step 3: Format Selection -->
  <div class="format-area" id="formatArea">
    <label for="formatSelect">Select format</label>
    <div class="format-row">
      <select class="format-select" id="formatSelect"></select>
      <button class="btn btn-download" id="downloadBtn" onclick="startDownload()">
        ⬇ Download
      </button>
    </div>
  </div>

  <!-- Step 4: Download Progress -->
  <div class="dl-progress-card" id="progressCard">
    <div class="dl-progress-header">
      <span class="dl-progress-label" id="progressLabel">Downloading</span>
      <span class="dl-progress-pct" id="progressPct">0%</span>
    </div>
    <div class="dl-progress-track">
      <div class="dl-progress-fill" id="progressFill"></div>
    </div>
    <div class="dl-progress-stats">
      <span id="progressSpeed"></span>
      <span id="progressEta"></span>
    </div>
    <div class="dl-progress-actions" id="progressActions" style="display:none;">
      <a class="btn btn-save" id="saveLink" href="#" download>Save File</a>
      <button class="btn btn-new" onclick="resetAll()">New Download</button>
    </div>
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <rect x="6" y="10" width="36" height="24" rx="3" stroke="currentColor" stroke-width="2"/>
      <polygon points="20,17 20,29 31,23" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/>
      <path d="M14 38h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p>Paste a YouTube link above to get started.<br>Powered by <a href="https://github.com/yt-dlp/yt-dlp" style="color:var(--accent);text-decoration:none;">yt-dlp</a>.</p>
  </div>
</div>

<footer>
  <a href="index.html"><span style="color: var(--accent);">dev.</span>nialfernandes.com</a>
  <span style="color: var(--text-muted); margin: 0 8px;">|</span>
  <a href="privacy.html">Privacy Policy</a>
</footer>

<script>
  // ── Theme toggle ──
  (function() {
    var toggle = document.querySelector('.theme-toggle');
    toggle.addEventListener('click', function() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  })();

  // ── Configuration ──
  // Point this at your backend server. No trailing slash.
  const API_BASE = 'https://your-server.example.com';

  // ── State ──
  let videoData = null;
  let currentJobId = null;
  let pollTimer = null;

  const urlInput     = document.getElementById('urlInput');
  const fetchBtn     = document.getElementById('fetchBtn');
  const fetchLoading = document.getElementById('fetchLoading');
  const fetchError   = document.getElementById('fetchError');
  const videoCard    = document.getElementById('videoCard');
  const formatArea   = document.getElementById('formatArea');
  const formatSelect = document.getElementById('formatSelect');
  const downloadBtn  = document.getElementById('downloadBtn');
  const progressCard = document.getElementById('progressCard');
  const emptyState   = document.getElementById('emptyState');

  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchInfo();
  });

  // ── Helpers ──
  function formatDuration(sec) {
    if (!sec) return '';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function formatViews(n) {
    if (!n) return '';
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B views';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M views';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K views';
    return n.toLocaleString('en-AU') + ' views';
  }

  function formatBytes(b) {
    if (!b) return '';
    if (b >= 1e9) return (b / 1e9).toFixed(1) + ' GB';
    if (b >= 1e6) return (b / 1e6).toFixed(1) + ' MB';
    if (b >= 1e3) return (b / 1e3).toFixed(1) + ' KB';
    return b + ' B';
  }

  function formatSpeed(bps) {
    if (!bps) return '';
    if (bps >= 1e6) return (bps / 1e6).toFixed(1) + ' MB/s';
    if (bps >= 1e3) return (bps / 1e3).toFixed(1) + ' KB/s';
    return Math.round(bps) + ' B/s';
  }

  function showError(msg) {
    fetchError.textContent = msg;
    fetchError.classList.add('visible');
  }

  function hideError() {
    fetchError.classList.remove('visible');
  }

  // ── Fetch video info ──
  async function fetchInfo() {
    const url = urlInput.value.trim();
    if (!url) return;

    hideError();
    videoCard.classList.remove('visible');
    formatArea.classList.remove('visible');
    progressCard.classList.remove('visible');
    emptyState.style.display = 'none';
    fetchLoading.classList.add('visible');
    fetchBtn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/api/info`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        showError(data.error || 'Failed to fetch video info.');
        emptyState.style.display = 'block';
        return;
      }

      videoData = data;
      renderVideoInfo(data);
      renderFormats(data.formats);

    } catch (err) {
      showError('Network error — is the server running?');
      emptyState.style.display = 'block';
    } finally {
      fetchLoading.classList.remove('visible');
      fetchBtn.disabled = false;
    }
  }

  function renderVideoInfo(data) {
    document.getElementById('videoThumb').src = data.thumbnail || '';
    document.getElementById('videoDuration').textContent = formatDuration(data.duration);
    document.getElementById('videoTitle').textContent = data.title || 'Untitled';
    document.getElementById('videoUploader').textContent = data.uploader || '';
    document.getElementById('videoViews').textContent = formatViews(data.view_count);
    videoCard.classList.add('visible');
  }

  function renderFormats(formats) {
    formatSelect.innerHTML = '';

    const presets = formats.filter(f => f.format_id.startsWith('__'));
    const videoAudio = formats.filter(f => !f.format_id.startsWith('__') && f.has_video && f.has_audio);
    const videoOnly  = formats.filter(f => !f.format_id.startsWith('__') && f.has_video && !f.has_audio);
    const audioOnly  = formats.filter(f => !f.format_id.startsWith('__') && !f.has_video && f.has_audio);

    function addGroup(label, items) {
      if (items.length === 0) return;
      const grp = document.createElement('optgroup');
      grp.label = label;
      items.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.format_id;
        let text = f.label;
        if (f.filesize) text += ` (${formatBytes(f.filesize)})`;
        text += ` [.${f.ext}]`;
        opt.textContent = text;
        grp.appendChild(opt);
      });
      formatSelect.appendChild(grp);
    }

    addGroup('Recommended', presets);
    addGroup('Video + Audio', videoAudio);
    addGroup('Video Only', videoOnly);
    addGroup('Audio Only', audioOnly);

    formatArea.classList.add('visible');
  }

  // ── Start download ──
  async function startDownload() {
    if (!videoData) return;

    const formatId = formatSelect.value;
    downloadBtn.disabled = true;

    progressCard.classList.add('visible');
    const fillEl = document.getElementById('progressFill');
    const pctEl  = document.getElementById('progressPct');
    const labelEl = document.getElementById('progressLabel');
    const speedEl = document.getElementById('progressSpeed');
    const etaEl   = document.getElementById('progressEta');
    const actionsEl = document.getElementById('progressActions');

    fillEl.className = 'dl-progress-fill indeterminate';
    fillEl.style.width = '40%';
    pctEl.textContent = 'Starting…';
    pctEl.className = 'dl-progress-pct';
    labelEl.textContent = 'Downloading';
    speedEl.textContent = '';
    etaEl.textContent = '';
    actionsEl.style.display = 'none';

    try {
      const res = await fetch(`${API_BASE}/api/download`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          url: videoData.url,
          format_id: formatId,
          title: videoData.title,
        }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        fillEl.className = 'dl-progress-fill error';
        fillEl.style.width = '100%';
        pctEl.textContent = 'Error';
        pctEl.className = 'dl-progress-pct error';
        labelEl.textContent = data.error || 'Download failed';
        actionsEl.style.display = 'flex';
        document.getElementById('saveLink').style.display = 'none';
        downloadBtn.disabled = false;
        return;
      }

      currentJobId = data.job_id;
      pollProgress();

    } catch (err) {
      fillEl.className = 'dl-progress-fill error';
      fillEl.style.width = '100%';
      pctEl.textContent = 'Error';
      pctEl.className = 'dl-progress-pct error';
      labelEl.textContent = 'Network error';
      downloadBtn.disabled = false;
    }
  }

  function pollProgress() {
    if (!currentJobId) return;

    pollTimer = setInterval(async () => {
      try {
        const res = await fetch(`${API_BASE}/api/status/${currentJobId}`);
        const job = await res.json();

        const fillEl = document.getElementById('progressFill');
        const pctEl  = document.getElementById('progressPct');
        const labelEl = document.getElementById('progressLabel');
        const speedEl = document.getElementById('progressSpeed');
        const etaEl   = document.getElementById('progressEta');
        const actionsEl = document.getElementById('progressActions');

        if (job.status === 'downloading') {
          fillEl.className = 'dl-progress-fill';
          fillEl.style.width = Math.max(job.progress || 0, 2) + '%';
          pctEl.textContent = (job.progress || 0).toFixed(1) + '%';
          speedEl.textContent = job.speed ? formatSpeed(job.speed) : '';
          etaEl.textContent = job.eta ? `${job.eta}s remaining` : '';
        } else if (job.status === 'processing') {
          fillEl.className = 'dl-progress-fill';
          fillEl.style.width = '100%';
          pctEl.textContent = 'Processing…';
          labelEl.textContent = 'Merging / converting';
          speedEl.textContent = '';
          etaEl.textContent = '';
        } else if (job.status === 'complete') {
          clearInterval(pollTimer);
          fillEl.className = 'dl-progress-fill done';
          fillEl.style.width = '100%';
          pctEl.textContent = 'Done';
          pctEl.className = 'dl-progress-pct done';
          labelEl.textContent = 'Download complete';
          speedEl.textContent = '';
          etaEl.textContent = '';
          actionsEl.style.display = 'flex';
          const saveLink = document.getElementById('saveLink');
          saveLink.style.display = '';
          saveLink.href = `${API_BASE}/api/file/${currentJobId}`;
          downloadBtn.disabled = false;
        } else if (job.status === 'error') {
          clearInterval(pollTimer);
          fillEl.className = 'dl-progress-fill error';
          fillEl.style.width = '100%';
          pctEl.textContent = 'Failed';
          pctEl.className = 'dl-progress-pct error';
          labelEl.textContent = job.error || 'Download failed';
          speedEl.textContent = '';
          etaEl.textContent = '';
          actionsEl.style.display = 'flex';
          document.getElementById('saveLink').style.display = 'none';
          downloadBtn.disabled = false;
        }
      } catch {}
    }, 800);
  }

  function resetAll() {
    if (pollTimer) clearInterval(pollTimer);
    currentJobId = null;
    videoData = null;
    urlInput.value = '';

    videoCard.classList.remove('visible');
    formatArea.classList.remove('visible');
    progressCard.classList.remove('visible');
    emptyState.style.display = 'block';
    downloadBtn.disabled = false;
    fetchBtn.disabled = false;
    hideError();

    urlInput.focus();
  }
</script>

</body>
</html>
