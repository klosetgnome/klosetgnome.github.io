<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Video Grabber</title>
<!-- Prevent flash of wrong theme -->
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link rel="stylesheet" href="astyle.css">
<style>
  /* ── Page-specific: Video Grabber ── */
  :root {
    --fetching: #8b6abf;
    --fetching-glow: rgba(139, 106, 191, 0.12);
  }

  [data-theme="dark"] {
    --fetching: #a688d4;
    --fetching-glow: rgba(166, 136, 212, 0.15);
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    flex: 1;
    width: 100%;
  }

  /* Instance status indicator */
  .instance-status {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
    margin-bottom: 8px;
    animation: fadeInUp 0.3s ease 0.05s both;
  }

  .instance-status a {
    color: var(--accent);
    text-decoration: none;
  }

  .instance-status a:hover { text-decoration: underline; }

  .instance-status .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }

  .instance-status .dot.ok { background: var(--success); }
  .instance-status .dot.loading { background: var(--fetching); animation: pulse 1.2s ease infinite; }
  .instance-status .dot.error { background: var(--error); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Input area */
  .input-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 12px;
    animation: fadeInUp 0.5s ease 0.1s both;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .input-area label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  .input-row input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--text-primary);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
  }

  .input-row input[type="text"]::placeholder { color: var(--text-muted); }

  .input-row input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .btn {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    padding: 12px 20px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-fetch {
    background: var(--accent);
    color: #fff;
  }

  .btn-fetch:hover {
    background: #d4623e;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .btn-fetch:active { transform: translateY(0); }

  .btn-fetch:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  /* Error message */
  .error-msg {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--error);
    padding: 10px 0 0;
    display: none;
    line-height: 1.5;
  }

  .error-msg.visible { display: block; }

  /* Loading state */
  .loading-bar {
    height: 3px;
    background: var(--border);
    border-radius: 3px;
    margin-top: 14px;
    overflow: hidden;
    display: none;
  }

  .loading-bar.visible { display: block; }

  .loading-bar-fill {
    height: 100%;
    background: var(--fetching);
    border-radius: 3px;
    width: 40%;
    animation: indeterminate 1.8s ease-in-out infinite;
  }

  /* Format select area */
  .format-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 12px;
    display: none;
    animation: fadeInUp 0.4s ease 0.05s both;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .format-area.visible { display: block; }

  .format-area label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .option-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .format-select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 36px 12px 16px;
    color: var(--text-primary);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%237a756b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }

  .format-select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .format-select option {
    background: var(--surface);
    color: var(--text-primary);
  }

  .format-select optgroup {
    font-family: var(--mono);
    font-weight: 500;
    color: var(--text-secondary);
  }

  .format-row {
    display: flex;
    gap: 10px;
  }

  .btn-download {
    background: var(--success);
    color: #fff;
    flex: 1;
  }

  .btn-download:hover {
    background: #5a9e4f;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px var(--success-glow);
  }

  .btn-download:active { transform: translateY(0); }

  .btn-download:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .btn-audio {
    background: var(--fetching);
    color: #fff;
    flex: 1;
  }

  .btn-audio:hover {
    background: #7a5aae;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px var(--fetching-glow);
  }

  .btn-audio:active { transform: translateY(0); }

  .btn-audio:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  /* Download progress / result card */
  .dl-progress-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    display: none;
    animation: fadeInUp 0.4s ease;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .dl-progress-card.visible { display: block; }

  .dl-progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .dl-progress-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .dl-progress-pct {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--fetching);
  }

  .dl-progress-pct.done { color: var(--success); }
  .dl-progress-pct.error { color: var(--error); }

  .dl-progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .dl-progress-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--fetching);
    transition: width 0.4s ease, background 0.3s;
    width: 0%;
  }

  .dl-progress-fill.done { background: var(--success); }
  .dl-progress-fill.error { background: var(--error); }

  .dl-progress-fill.indeterminate {
    width: 40%;
    animation: indeterminate 1.8s ease-in-out infinite;
  }

  .dl-progress-stats {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    gap: 16px;
  }

  .dl-progress-actions {
    margin-top: 16px;
    display: flex;
    gap: 10px;
  }

  .btn-save {
    background: var(--success);
    color: #fff;
  }

  .btn-save:hover {
    background: #5a9e4f;
    box-shadow: 0 4px 16px var(--success-glow);
  }

  .btn-new {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }

  .btn-new:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    animation: fadeInUp 0.4s ease 0.15s both;
  }

  .empty-state svg { margin-bottom: 16px; opacity: 0.3; }

  .empty-state p {
    font-size: 15px;
    line-height: 1.6;
  }

  .empty-state a {
    color: var(--accent);
    text-decoration: none;
  }

  .empty-state a:hover { text-decoration: underline; }

  /* Animations */
  @keyframes indeterminate {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .container { padding: 32px 16px 60px; }
    .input-row, .format-row { flex-direction: column; }
    .options-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="site-header">
  <h1><span>VIDEO</span> GRABBER</h1>
  <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </svg>
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/><path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/><path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
    </svg>
  </button>
</header>

<div class="container">

  <!-- Instance status -->
  <div class="instance-status" id="instanceStatus">
    <span class="dot loading"></span> Finding download servers…
  </div>

  <!-- Step 1: URL Input -->
  <div class="input-area" id="inputArea">
    <label for="urlInput">Video link</label>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" spellcheck="false">
      <button class="btn btn-fetch" id="fetchBtn" onclick="handleDownload('video')">Fetch</button>
    </div>
    <div class="loading-bar" id="fetchLoading"><div class="loading-bar-fill"></div></div>
    <div class="error-msg" id="fetchError"></div>
  </div>

  <!-- Step 2: Download Options -->
  <div class="format-area" id="formatArea">
    <label>Download options</label>
    <div class="options-grid">
      <div>
        <div class="option-label">Video quality</div>
        <select class="format-select" id="qualitySelect">
          <option value="max">Best available</option>
          <option value="2160">4K (2160p)</option>
          <option value="1080" selected>1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
          <option value="144">144p</option>
        </select>
      </div>
      <div>
        <div class="option-label">Audio format</div>
        <select class="format-select" id="audioFormatSelect">
          <option value="mp3">MP3</option>
          <option value="best" selected>Best</option>
          <option value="ogg">OGG</option>
          <option value="wav">WAV</option>
          <option value="opus">Opus</option>
        </select>
      </div>
    </div>
    <div class="format-row">
      <button class="btn btn-download" id="dlVideoBtn" onclick="handleDownload('video')">⬇ Download Video</button>
      <button class="btn btn-audio" id="dlAudioBtn" onclick="handleDownload('audio')">♫ Audio Only</button>
    </div>
  </div>

  <!-- Step 3: Result -->
  <div class="dl-progress-card" id="progressCard">
    <div class="dl-progress-header">
      <span class="dl-progress-label" id="progressLabel">Downloading</span>
      <span class="dl-progress-pct" id="progressPct"></span>
    </div>
    <div class="dl-progress-track">
      <div class="dl-progress-fill" id="progressFill"></div>
    </div>
    <div class="dl-progress-stats">
      <span id="progressInfo"></span>
    </div>
    <div class="dl-progress-actions" id="progressActions" style="display:none;">
      <a class="btn btn-save" id="saveLink" href="#" target="_blank" rel="noopener">Save File</a>
      <button class="btn btn-new" onclick="resetAll()">New Download</button>
    </div>
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <rect x="6" y="10" width="36" height="24" rx="3" stroke="currentColor" stroke-width="2"/>
      <polygon points="20,17 20,29 31,23" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/>
      <path d="M14 38h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p>Paste a video link above to get started.<br>
    Supports YouTube, TikTok, Instagram, Twitter &amp; more.</p>
  </div>
</div>

<footer>
  <a href="index.html"><span style="color: var(--accent);">dev.</span>nialfernandes.com</a>
  <span style="color: var(--text-muted); margin: 0 8px;">|</span>
  <a href="privacy.html">Privacy Policy</a>
</footer>

<script>
  // ── Theme toggle ──
  (function() {
    var toggle = document.querySelector('.theme-toggle');
    toggle.addEventListener('click', function() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  })();

  // ── State ──
  let instances = [];
  let working = false;
  let instanceRetryTimer = null;

  const urlInput     = document.getElementById('urlInput');
  const fetchBtn     = document.getElementById('fetchBtn');
  const fetchLoading = document.getElementById('fetchLoading');
  const fetchError   = document.getElementById('fetchError');
  const formatArea   = document.getElementById('formatArea');
  const progressCard = document.getElementById('progressCard');
  const emptyState   = document.getElementById('emptyState');
  const statusEl     = document.getElementById('instanceStatus');

  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleDownload('video');
  });

  // Show options when URL looks valid
  urlInput.addEventListener('input', () => {
    const url = urlInput.value.trim();
    if (url && url.includes('http')) {
      formatArea.classList.add('visible');
    }
  });

  // ── Fetch cobalt instances with automatic retry ──
  async function loadInstances() {
    try {
      const res = await fetch('https://instances.cobalt.best/api/instances.json', {
        headers: { 'User-Agent': 'dev-nialfernandes/1.0 (+https://dev.nialfernandes.com)' }
      });
      const data = await res.json();

      // Filter: online, no auth required, CORS enabled, supports YouTube
      instances = data.filter(inst =>
        inst.online &&
        inst.info && inst.info.auth === false &&
        inst.info.cors === true &&
        inst.services && inst.services.youtube === true &&
        inst.protocol === 'https'
      ).map(inst => `${inst.protocol}://${inst.api}`);

      if (instances.length > 0) {
        statusEl.innerHTML = `<span class="dot ok"></span> ${instances.length} download server${instances.length > 1 ? 's' : ''} available`;
        // Clear any pending retry
        if (instanceRetryTimer) {
          clearTimeout(instanceRetryTimer);
          instanceRetryTimer = null;
        }
      } else {
        statusEl.innerHTML = `<span class="dot loading"></span> Searching for servers — please wait…`;
        scheduleRetry();
      }
    } catch (err) {
      instances = [];
      statusEl.innerHTML = `<span class="dot loading"></span> Connecting to servers — please wait…`;
      scheduleRetry();
    }
  }

  // Retry loading instances with exponential backoff (max 30s)
  let retryAttempt = 0;
  function scheduleRetry() {
    retryAttempt++;
    const delay = Math.min(3000 * Math.pow(1.5, retryAttempt - 1), 30000);
    instanceRetryTimer = setTimeout(() => {
      statusEl.innerHTML = `<span class="dot loading"></span> Retrying connection (attempt ${retryAttempt + 1})…`;
      loadInstances();
    }, delay);
  }

  loadInstances();

  // ── Helpers ──
  function showError(msg) {
    fetchError.textContent = msg;
    fetchError.classList.add('visible');
  }

  function hideError() {
    fetchError.classList.remove('visible');
  }

  function setButtonsDisabled(state) {
    fetchBtn.disabled = state;
    document.getElementById('dlVideoBtn').disabled = state;
    document.getElementById('dlAudioBtn').disabled = state;
  }

  // ── Download via cobalt ──
  async function handleDownload(mode) {
    const url = urlInput.value.trim();
    if (!url) return;

    // If no instances yet, try a fresh load before giving up
    if (instances.length === 0) {
      hideError();
      fetchLoading.classList.add('visible');
      setButtonsDisabled(true);
      statusEl.innerHTML = `<span class="dot loading"></span> Connecting to servers…`;

      await loadInstances();

      if (instances.length === 0) {
        fetchLoading.classList.remove('visible');
        setButtonsDisabled(false);
        showError('Download servers are temporarily unavailable. Please try again shortly.');
        return;
      }
    }

    hideError();
    progressCard.classList.remove('visible');
    emptyState.style.display = 'none';
    formatArea.classList.add('visible');
    fetchLoading.classList.add('visible');
    setButtonsDisabled(true);
    working = true;

    // Show indeterminate progress
    const fillEl  = document.getElementById('progressFill');
    const pctEl   = document.getElementById('progressPct');
    const labelEl = document.getElementById('progressLabel');
    const infoEl  = document.getElementById('progressInfo');
    const actionsEl = document.getElementById('progressActions');

    progressCard.classList.add('visible');
    fillEl.className = 'dl-progress-fill indeterminate';
    fillEl.style.width = '40%';
    pctEl.textContent = '';
    pctEl.className = 'dl-progress-pct';
    labelEl.textContent = 'Connecting to server…';
    infoEl.textContent = '';
    actionsEl.style.display = 'none';

    const quality = document.getElementById('qualitySelect').value;
    const audioFormat = document.getElementById('audioFormatSelect').value;

    const body = {
      url: url,
      videoQuality: quality,
      audioFormat: audioFormat,
      filenameStyle: 'pretty',
    };

    if (mode === 'audio') {
      body.downloadMode = 'audio';
    }

    // Try instances in order until one works
    let lastError = 'All servers failed. Try again later.';
    let tried = 0;

    for (const instance of instances) {
      if (!working) break;
      tried++;
      labelEl.textContent = `Trying server ${tried} of ${instances.length}…`;

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);

        const res = await fetch(instance, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(body),
          signal: controller.signal,
        });

        clearTimeout(timeout);
        const data = await res.json();

        if (data.status === 'tunnel' || data.status === 'redirect') {
          // Success
          fetchLoading.classList.remove('visible');
          setButtonsDisabled(false);
          working = false;

          fillEl.className = 'dl-progress-fill done';
          fillEl.style.width = '100%';
          pctEl.textContent = 'Done';
          pctEl.className = 'dl-progress-pct done';
          labelEl.textContent = 'Download ready';
          infoEl.textContent = data.filename || '';
          actionsEl.style.display = 'flex';

          const link = document.getElementById('saveLink');
          link.href = data.url;
          if (data.filename) link.download = data.filename;

          // Auto-open download
          window.open(data.url, '_blank');
          return;

        } else if (data.status === 'picker') {
          // Multiple items (carousel, etc.) — take the first
          fetchLoading.classList.remove('visible');
          setButtonsDisabled(false);
          working = false;

          const firstItem = data.picker && data.picker[0];
          if (firstItem && firstItem.url) {
            fillEl.className = 'dl-progress-fill done';
            fillEl.style.width = '100%';
            pctEl.textContent = 'Done';
            pctEl.className = 'dl-progress-pct done';
            labelEl.textContent = 'Download ready';
            infoEl.textContent = '';
            actionsEl.style.display = 'flex';

            const link = document.getElementById('saveLink');
            link.href = firstItem.url;
            window.open(firstItem.url, '_blank');
          } else {
            showError('Multiple items found but none could be downloaded.');
            progressCard.classList.remove('visible');
            emptyState.style.display = 'block';
          }
          return;

        } else if (data.status === 'error') {
          lastError = data.error?.code || 'Unknown error from server';
          continue;
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          lastError = 'Server timed out';
        } else {
          lastError = err.message || 'Connection failed';
        }
        continue;
      }
    }

    // All instances failed
    fetchLoading.classList.remove('visible');
    setButtonsDisabled(false);
    working = false;

    // Friendly error messages
    let friendlyError = lastError;
    if (lastError.includes('content.video.unavailable')) {
      friendlyError = 'This video is unavailable or private.';
    } else if (lastError.includes('content.video.live')) {
      friendlyError = "Can't download live streams.";
    } else if (lastError.includes('content.video.age')) {
      friendlyError = 'Age-restricted content — unable to process this video.';
    } else if (lastError.includes('rate')) {
      friendlyError = 'Rate limited — try again in a moment.';
    } else if (lastError.includes('link')) {
      friendlyError = "Couldn't process this URL. Check the link and try again.";
    } else if (lastError.includes('All servers failed')) {
      friendlyError = 'All servers are busy. Please try again shortly.';
    }

    fillEl.className = 'dl-progress-fill error';
    fillEl.style.width = '100%';
    pctEl.textContent = 'Failed';
    pctEl.className = 'dl-progress-pct error';
    labelEl.textContent = friendlyError;
    infoEl.textContent = '';
    actionsEl.style.display = 'flex';
    document.getElementById('saveLink').style.display = 'none';

    // Silently refresh instances in the background for next attempt
    loadInstances();
  }

  function resetAll() {
    working = false;
    urlInput.value = '';
    formatArea.classList.remove('visible');
    progressCard.classList.remove('visible');
    emptyState.style.display = 'block';
    setButtonsDisabled(false);
    hideError();
    document.getElementById('saveLink').style.display = '';
    urlInput.focus();
  }
</script>

</body>
</html>
