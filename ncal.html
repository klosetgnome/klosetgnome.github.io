<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>My Cal</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=DM+Mono:wght@400&display=swap');

:root{
  --bg: #f4f1ec;
  --surface: #fff;
  --text: #2c2a26;
  --text-muted: #7a756b;
  --accent: #c0512d;
  --border: #d9d4cb;
  --serif: 'Source Serif 4', Georgia, serif;
  --mono: 'DM Mono', 'Courier New', monospace;
  
  --good-bg: #d7eadf;
  --good-txt: #1f5134;
  --bad-bg: #efd6d6;
  --bad-txt: #6b2a2a;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body{
  margin: 0;
  font-family: var(--serif);
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px;
}

.app{
  text-align: center;
}

.topbar{
  display: flex;
  gap: 24px;
  align-items: center;
  justify-content: center;
  margin-bottom: 32px;
}

button{
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 14px;
  transition: all 0.2s ease;
}

button:hover {
  background: rgba(192, 81, 45, 0.08);
  color: var(--accent);
  border-color: var(--accent);
}

.month-label{
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  min-width: 160px;
  padding: 8px 16px;
  border-radius: 6px;
  transition: background 0.2s ease;
}

.month-label.good {
  background: var(--good-bg);
  color: var(--good-txt);
}

.month-label.bad {
  background: var(--bad-bg);
  color: var(--bad-txt);
}

.calendar{
  display: grid;
  grid-template-columns: repeat(7, 56px);
  gap: 8px;
  justify-content: center;
  padding: 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 32px;
}

.day-name{
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  text-transform: uppercase;
  padding-bottom: 8px;
}

.date{
  width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  font-size: 14px;
  transition: all 0.2s ease;
  border: 1px solid transparent;
}

.good{
  background: var(--good-bg);
  color: var(--good-txt);
}

.good:hover {
  border-color: var(--good-txt);
}

.bad{
  background: var(--bad-bg);
  color: var(--bad-txt);
}

.bad:hover {
  border-color: var(--bad-txt);
}

.empty{
  visibility: hidden;
}

.selected::after{
  content: "";
  position: absolute;
  inset: -4px;
  border: 2px solid var(--accent);
  border-radius: 8px;
}

.info{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 24px;
  border-radius: 6px;
  font-weight: 600;
  font-family: var(--mono);
  letter-spacing: 2px;
  font-size: 12px;
  text-transform: uppercase;
  min-width: 120px;
  border: 1px solid transparent;
}

.info.good {
  background: var(--good-bg);
  color: var(--good-txt);
}

.info.bad {
  background: var(--bad-bg);
  color: var(--bad-txt);
}
</style>
</head>

<body>

<div class="app">
  <div class="topbar">
    <button id="prev">← Prev</button>
    <div id="label" class="month-label"></div>
    <button id="next">Next →</button>
  </div>

  <div id="calendar" class="calendar"></div>
  <div id="info" class="info">—</div>
</div>

<script>
const badVals=[2,4,8];

let current=new Date();
current.setDate(1);

const today=new Date();
let selectedEl=null;
let selectedDate=new Date(today);

function digitSum(n){
  return n.toString().split('').reduce((a,b)=>a+ +b,0);
}

function digitalRoot(n){
  while(n>9) n=digitSum(n);
  return n;
}

function goodOrBad(n){
  return badVals.includes(digitalRoot(n))?"bad":"good";
}

function yearMonthValue(y,m){
  return digitalRoot(digitSum(y)+digitSum(m));
}

function dayValue(d){
  return digitalRoot(digitSum(d));
}

function updateInfo(y,m,d){
  const ym=yearMonthValue(y,m);
  const dv=dayValue(d);

  const info=document.getElementById("info");
  info.textContent=`${ym}, ${dv}`;

  const combinedRoot=digitalRoot(ym+dv);
  info.className="info "+(badVals.includes(combinedRoot)?"bad":"good");
}

function select(el,y,m,d){
  if(selectedEl) selectedEl.classList.remove("selected");
  selectedEl=el;
  el.classList.add("selected");

  selectedDate=new Date(y,m-1,d);
  updateInfo(y,m,d);
}

function render(){
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  selectedEl=null;

  const y=current.getFullYear();
  const m=current.getMonth()+1;

  const label=document.getElementById("label");
  label.textContent=`${y}-${String(m).padStart(2,'0')}`;
  label.className="month-label "+goodOrBad(digitSum(y)+digitSum(m));

  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  names.forEach(d=>{
    const e=document.createElement("div");
    e.textContent=d;
    e.className="day-name";
    cal.appendChild(e);
  });

  const firstDay=new Date(y,m-1,1).getDay();
  const daysInMonth=new Date(y,m,0).getDate();

  for(let i=0;i<firstDay;i++){
    const e=document.createElement("div");
    e.className="date empty";
    cal.appendChild(e);
  }

  for(let d=1; d<=daysInMonth; d++){
    const el=document.createElement("div");
    el.className="date "+goodOrBad(digitSum(d));
    el.textContent=d;

    el.onclick=()=>{
      const combined=digitSum(y)+digitSum(m)+digitSum(d);
      el.classList.remove("good","bad");
      el.classList.add(goodOrBad(combined));
      select(el,y,m,d);
    };

    cal.appendChild(el);

    if(
      d===selectedDate.getDate() &&
      m-1===selectedDate.getMonth() &&
      y===selectedDate.getFullYear()
    ){
      select(el,y,m,d);
    }
  }
}

function moveSelection(days){
  selectedDate.setDate(selectedDate.getDate()+days);
  current=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
  render();
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") moveSelection(-1);
  if(e.key==="ArrowRight") moveSelection(1);
  if(e.key==="ArrowUp") moveSelection(-7);
  if(e.key==="ArrowDown") moveSelection(7);
});

document.getElementById("prev").onclick=()=>{
  current.setMonth(current.getMonth()-1);
  render();
};

document.getElementById("next").onclick=()=>{
  current.setMonth(current.getMonth()+1);
  render();
};

render();
</script>

</body>
</html>
